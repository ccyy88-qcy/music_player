name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'

      - name: Create fresh Flutter project
        run: |
          flutter create --org com.alee --project-name music_player --platforms android tmp_project
          # Copy our Dart code into the fresh project
          cp -r lib/* tmp_project/lib/
          cp pubspec.yaml tmp_project/
          cp analysis_options.yaml tmp_project/
          # Copy our Android manifest
          cp android/app/src/main/AndroidManifest.xml tmp_project/android/app/src/main/
          # Copy drawable
          mkdir -p tmp_project/android/app/src/main/res/drawable
          cp android/app/src/main/res/drawable/ic_launcher.xml tmp_project/android/app/src/main/res/drawable/
          mv tmp_project music_player_app
          cd music_player_app

      - name: Generate keystore
        run: |
          cd music_player_app
          keytool -genkey -v -keystore android/app/release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Alee"

      - name: Create key.properties
        run: |
          cd music_player_app
          echo "storePassword=android" > android/key.properties
          echo "keyPassword=android" >> android/key.properties
          echo "keyAlias=release" >> android/key.properties
          echo "storeFile=release.keystore" >> android/key.properties

      - name: Configure signing
        run: |
          cd music_player_app
          sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/' android/app/build.gradle.kts 2>/dev/null || true

      - name: Install dependencies
        run: cd music_player_app && flutter pub get

      - name: Build APK
        run: cd music_player_app && flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: music-player-apk
          path: music_player_app/build/app/outputs/flutter-apk/app-release.apk

name: music_player
description: "本地音乐播放器 - DJ与流行歌曲分类播放"
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  just_audio: ^0.9.40
  permission_handler: ^11.3.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.0
  http: ^1.2.0
  pointycastle: ^3.9.1
  crypto: ^3.0.6
  audio_session: ^0.1.21

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
